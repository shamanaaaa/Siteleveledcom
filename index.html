<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06060B" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-96x96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Tvorba webstránok od 300 € a e-shopov od 1 000 € pre slovenské firmy. Návrh vášho nového webu dostanete zadarmo do 24 hodín, bez zálohy."
    />
    <!-- Title, description and Open Graph: scripts/seoPages.ts writes each route's own (src/app/seo/pages.ts)
         and scripts/cityPages.ts each client's /mesto/<id>/ page. These are the home page's. -->
    <title>Tvorba webstránok a e-shopov na mieru | SiteLeveled</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SiteLeveled" />
    <meta property="og:locale" content="sk_SK" />
    <meta property="og:title" content="Tvorba webstránok a e-shopov na mieru | SiteLeveled" />
    <meta
      property="og:description"
      content="Tvorba webstránok od 300 € a e-shopov od 1 000 € pre slovenské firmy. Návrh vášho nového webu dostanete zadarmo do 24 hodín, bez zálohy."
    />
    <meta property="og:image" content="https://siteleveled.com/og/siteleveled.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixelové mesto klientov SiteLeveled" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Visit statistics: Umami on our own server, no cookies (docs/umami-setup.md, privacy page).
         stats-filter.js keeps audit ids out of the statistics; deferred scripts run in order, so it is ready first.
         No inline scripts here: the Content-Security-Policy in nginx allows only files (docs/security-headers.md) -->
    <script defer src="/stats-filter.js"></script>
    <script defer src="https://stats.siteleveled.com/script.js" data-website-id="21496767-d9b3-47a6-ac41-f7a0c60fc229"
      data-domains="siteleveled.com" data-exclude-hash="true" data-do-not-track="true"
      data-performance="true" data-before-send="slStatsFilter"></script>
    <!-- Without JavaScript nothing would ever reveal the sections -->
    <noscript><style>[data-reveal],[style*="opacity:0"]{opacity:1!important;transform:none!important}.kinetic-word{animation:none!important}</style></noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
